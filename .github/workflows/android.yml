name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug and release APKs
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease

      - name: List lint errors for review
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path("app/build/reports/lint-results-debug.xml")
          if not report.exists():
              print("Lint report was not created.")
          else:
              root = ET.parse(report).getroot()
              errors = [issue for issue in root.findall("issue") if issue.get("severity") == "Error"]
              for issue in errors:
                  location = issue.find("location")
                  where = ""
                  if location is not None:
                      where = f"{location.get('file', '')}:{location.get('line', '')} "
                  print(f"Lint ERROR {issue.get('id', '')} {where}{issue.get('message', '')}")
              print(f"Lint errors listed: {len(errors)}")
          PY

      - name: Save lint report for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remux-folder-lint-report
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.xml
          if-no-files-found: ignore

      - name: Confirm the APK does not request Internet access
        shell: bash
        run: |
          if "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions app/build/outputs/apk/debug/app-debug.apk | grep -q "android.permission.INTERNET"; then
            echo "The merged APK unexpectedly requests Internet permission."
            exit 1
          fi

      - name: Publish APKs
        uses: actions/upload-artifact@v4
        with:
          name: remux-folder-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error

